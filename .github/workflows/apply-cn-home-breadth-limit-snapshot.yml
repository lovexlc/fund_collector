name: Apply CN home snapshot parity

on:
  push:
    branches:
      - "fix/cn-home-breadth-limit-snapshot"
    paths:
      - ".github/workflows/apply-cn-home-breadth-limit-snapshot.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/cn-home-breadth-limit-snapshot"
      - run: python3 scripts/apply_cn_home_breadth_limit_snapshot.py
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_collector/aggregates.py market_collector/core.py tests/test_home_snapshot_parity.py
          git commit -m "fix: use Mini Program breadth pool and quota snapshot"
          git rm scripts/apply_cn_home_breadth_limit_snapshot.py .github/workflows/apply-cn-home-breadth-limit-snapshot.yml
          git commit -m "chore: remove temporary snapshot patch files"
          git push
