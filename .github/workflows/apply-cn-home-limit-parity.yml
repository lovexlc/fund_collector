name: Apply CN home limit parity

on:
  push:
    branches:
      - "fix/cn-home-limit-parity"
    paths:
      - ".github/workflows/apply-cn-home-limit-parity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/cn-home-limit-parity"
      - name: Apply patch
        run: python3 scripts/apply_cn_home_limit_parity.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_collector/aggregates.py tests/test_home_limit_parity.py
          git commit -m "fix: align CN home limits with mini program"
          git rm scripts/apply_cn_home_limit_parity.py .github/workflows/apply-cn-home-limit-parity.yml
          git commit -m "chore: remove temporary parity files"
          git push
