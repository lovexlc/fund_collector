name: Apply local home collector patch
on:
  push:
    branches: [feat/home-local-collect]
    paths: [scripts/apply_home_local_collect.py]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/home-local-collect}
      - run: python scripts/apply_home_local_collect.py
      - run: python -m unittest tests.test_http_server tests.test_product_snapshot
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market_collector/http_server.py market_collector/product_snapshot.py tests/test_http_server.py
          git commit -m 'feat: serve home dashboard from local collector' || exit 0
          git push
